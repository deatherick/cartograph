name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Rebuilds the web UI fresh (web/ -> internal/httpserver/web/) so CI
      # never tests against a possibly-stale committed frontend build —
      # see Makefile's `web` target and docs/adr/0015-react-web-ui.md.
      - run: make web
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make web
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
